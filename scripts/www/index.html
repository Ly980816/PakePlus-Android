<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    overflow: hidden; background: #f5f6f8; color: #1a1a1a;

                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

  }
  .header {
    flex: none; display: flex; align-items: center; justify-content: space-between;

  .model-btn {
    display: flex; align-items: center; gap: 8px;
    border: none; background: none; padding: 7px 10px;
    font-size: 16px; font-weight: 600; color: inherit; cursor: pointer;
    font-family: inherit; border-radius: 10px; max-width: 72vw;
  }
  .model-btn:active { background: #f2f4f7; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.15); }
  .model-btn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-btn .chev { flex: none; width: 14px; height: 14px; color: #9aa1ae; }
  .clear-btn { flex: none; border: none; background: none; color: #6b7280;
    font-size: 14px; padding: 8px 10px; cursor: pointer; font-family: inherit; }
  .clear-btn:active { opacity: .5; }

  .messages {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 16px;
  }
  .msg { display: flex; gap: 8px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .avatar {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; font-size: 12px; font-weight: 600; user-select: none;
  }
  .msg.ai .avatar { background: linear-gradient(135deg,#4f7cff,#7b5cff); color:#fff; }
  .msg.user .avatar { background: #e8ebf2; color: #556; }
  .bubble {
    max-width: calc(100% - 48px); padding: 10px 14px;
    border-radius: 16px; border-top-left-radius: 4px; background: #fff;
    box-shadow: 0 1px 2px rgba(16,24,40,.06); line-height: 1.65;
    word-break: break-word; overflow-wrap: anywhere;
  }
  .msg.user .bubble {
    background: #4f7cff; color: #fff;
    border-top-left-radius: 16px; border-top-right-radius: 4px;
  }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble h1,.bubble h2,.bubble h3,.bubble h4 { margin: 12px 0 6px; font-size: 16px; line-height: 1.4; }
  .bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child { margin-top: 0; }
  .bubble ul,.bubble ol { margin: 6px 0; padding-left: 20px; }
  .bubble li { margin: 3px 0; }
  .bubble pre { margin: 8px 0; padding: 10px 12px; background: #f6f8fa;
    border-radius: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .bubble pre code { background: none; padding: 0; font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .bubble code { background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px;
    font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .bubble a { color: #4f7cff; }
  .msg.user .bubble a { color: #fff; }
  .msg.user .bubble code { background: rgba(255,255,255,.22); }
  .msg.user .bubble pre { background: rgba(0,0,0,.16); color: #fff; }
  .bubble img { display: block; max-width: 100%; height: auto; border-radius: 10px;
    margin: 6px 0; cursor: zoom-in; background: #f2f4f7; }
  .bubble img:first-child { margin-top: 0; }
  .bubble img:last-child { margin-bottom: 0; }
  .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 6px; margin-top: 6px; }
  .img-grid img { width: 100%; height: 96px; object-fit: cover; border-radius: 10px;
    cursor: zoom-in; margin: 0; }
  .msg.user .img-grid img { border: 1px solid rgba(255,255,255,.28); }
  .bubble > .txt:empty { display: none; }
  .bubble > .txt:not(:empty) + .img-grid { margin-top: 8px; }
  .err { color: #e5484d; }
  .meta-note { font-size: 12px; color: #8a92a1; margin-top: 6px; }
  .gen-hint { font-size: 12px; color: #6b7280; margin-top: 8px;
    padding-top: 8px; border-top: 1px dashed #e5e8ee; }

  .bubble.streaming::after {
    content: ''; display: inline-block; width: 7px; height: 15px;
    background: #4f7cff; vertical-align: -2px; margin-left: 3px;
    animation: caret .9s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: #b9c0cc;
    animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink {
    0%,60%,100% { opacity: .3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip { border: 1px solid #e3e6ec; background: #fff; color: #3d4657;

  .chip:active { background: #f0f2f6; }

  .preview-item .rm {

  .input-row { display: flex; align-items: flex-end; gap: 8px; }
  .attach { flex: none; width: 40px; height: 40px; border: none; border-radius: 50%;

  .input { flex: 1; resize: none; border: none; outline: none; background: #f2f4f7;

  .send:active:not(:disabled) { transform: scale(.92); }
  .send svg { width: 18px; height: 18px; }

  .sheet-mask.show { opacity: 1; pointer-events: auto; }

  .sheet-handle { width: 38px; height: 4px; border-radius: 3px; background: #dfe3ea; margin: 6px auto 4px; }
  .sheet-title { font-size: 13px; color: #8a92a1; padding: 6px 20px 8px; font-weight: 500; }
  .model-item { display: flex; align-items: center; gap: 12px; width: 100%;

  .tag.vision { background: #e6f6ec; color: #16a34a; }

    transform: translateX(-50%) translateY(8px); background: rgba(0,0,0,.8);
    color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 18px;
    opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
    z-index: 200; max-width: 82vw; text-align: center; line-height: 1.5; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

/* =========================================================
 *  4. 工具

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}

  clearTimeout(toastTimer);

}

function openLightbox(src) { lightboxImg.src = src; lightbox.classList.add('show'); }
lightbox.addEventListener('click', () => { lightbox.classList.remove('show'); lightboxImg.src = ''; });

function getModel(id) { return MODELS.find(m => m.id === (id || currentModelId)) || MODELS[0]; }
function getHistory() {
  if (!histories[currentModelId]) histories[currentModelId] = [];
  return histories[currentModelId];
}

/* =========================================================
 *  5. Markdown 渲染
 * ========================================================= */
function inlineMd(s, allowImages) {
  s = escapeHtml(s);
  if (allowImages) {
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, url) => {
      if (!/^(https?:\/\/|data:image\/)/i.test(url)) return m;
      return `<img src="${url}" alt="${escapeHtml(alt)}" loading="lazy">`;
    });
  }
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}

function mdToHtml(src, allowImages = true) {
  const codes = [];
  const stash = (code) => {
    codes.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ''))}</code></pre>`);
    return `\u0000C${codes.length - 1}\u0000`;
  };
  src = src.replace(/```[ \t]*(\w*)[ \t]*\r?\n?([\s\S]*?)```/g, (m, l, c) => stash(c));
  src = src.replace(/```[ \t]*(\w*)[ \t]*\r?\n?([\s\S]*)$/,       (m, l, c) => stash(c));

  const lines = src.split('\n');
  let html = ''; let listType = null;
  const closeList = () => { if (listType) { html += `</${listType}>`; listType = null; } };

  for (const line of lines) {
    if (/^\u0000C\d+\u0000$/.test(line.trim())) { closeList(); html += line.trim(); continue; }
    if (!line.trim()) { closeList(); continue; }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      closeList();
      const lv = Math.min(m[1].length, 4);
      html += `<h${lv}>${inlineMd(m[2], allowImages)}</h${lv}>`;
      continue;
    }
    if ((m = line.match(/^>\s?(.*)$/))) {
      closeList();
      html += `<blockquote style="margin:6px 0;padding:2px 10px;border-left:3px solid #dfe3ea;color:#6b7280">${inlineMd(m[1], allowImages)}</blockquote>`;
      continue;
    }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
      html += `<li>${inlineMd(m[1], allowImages)}</li>`;
      continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
      if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
      html += `<li>${inlineMd(m[1], allowImages)}</li>`;
      continue;
    }
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
      closeList();
      html += '<hr style="border:none;border-top:1px solid #e8eaee;margin:10px 0">';
      continue;
    }
    closeList();
    html += `<p>${inlineMd(line, allowImages)}</p>`;
  }
  closeList();
  return html.replace(/\u0000C(\d+)\u0000/g, (m, i) => codes[+i]);
}

function isNearBottom() {
  return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 100;
}
function scrollToBottom(force) {
  if (!force && !isNearBottom()) return;
  requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
}

function appendMessage(role, content, opts = {}) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : 'AI';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (opts.loading) {
    bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  } else {
    const hasText = content && String(content).trim() !== '';
    if (hasText) {
      const txt = document.createElement('div');
      txt.className = 'txt';
      if (opts.plain || role === 'user') txt.textContent = content;
      else txt.innerHTML = mdToHtml(content, opts.allowImages !== false);
      bubble.appendChild(txt);
    }
    if (opts.images && opts.images.length) {
      const grid = document.createElement('div');
      grid.className = 'img-grid';
      opts.images.forEach(url => {
        const im = document.createElement('img');
        im.src = url; im.loading = 'lazy'; im.alt = '上传的图片';
        grid.appendChild(im);
      });
      bubble.appendChild(grid);
    }
    if (opts.note) {
      const n = document.createElement('div');
      n.className = 'meta-note';
      n.textContent = opts.note;
      bubble.appendChild(n);
    }
  }
  wrap.append(avatar, bubble);
  messagesEl.appendChild(wrap);
  scrollToBottom(true);
  return { wrap, bubble };
}

messagesEl.addEventListener('click', (e) => {

/* =========================================================
 *  8. 图片处理
 * ========================================================= */
function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(new Error('图片读取失败'));
    fr.readAsDataURL(file);
  });
}
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('图片解析失败'));
    img.src = src;
  });
}

async function compressImage(file) {
  if (!file.type.startsWith('image/')) throw new Error('只支持图片文件');
  if (file.size > GLOBAL.imageMaxBytes) {
    throw new Error(`图片过大（上限 ${Math.round(GLOBAL.imageMaxBytes / 1024 / 1024)}MB）`);
  }
  const raw = await readAsDataURL(file);
  if (file.type === 'image/gif') return { dataUrl: raw, name: file.name };

  const img = await loadImage(raw);
  let w = img.naturalWidth || img.width;
  let h = img.naturalHeight || img.height;
  const scale = Math.min(1, GLOBAL.imageMaxSize / Math.max(w, h));
  w = Math.max(1, Math.round(w * scale));
  h = Math.max(1, Math.round(h * scale));

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const isPng = file.type === 'image/png';
  if (!isPng) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
  ctx.drawImage(img, 0, 0, w, h);

  let out = canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', GLOBAL.imageQuality);
  if (out.length > 1.6 * 1024 * 1024) out = canvas.toDataURL('image/jpeg', 0.7);
  return { dataUrl: out, name: file.name };
}

 *  9. 待发送图片预览

function renderPreview() {
  previewBar.innerHTML = '';
  previewBar.classList.toggle('show', pendingImages.length > 0);
  pendingImages.forEach(item => {
    const box = document.createElement('div');

    rm.setAttribute('aria-label', '移除图片');
    rm.onclick = () => {
      pendingImages = pendingImages.filter(p => p.id !== item.id);
      renderPreview(); updateSendBtn();
    };
    box.appendChild(rm);
    previewBar.appendChild(box);
  });
}

async function addImages(files) {
  const model = getModel();
  if (!model.vision) {
    toast(`「${model.name}」不支持图片输入\n请切换到带「图片」标签的模型`);
    fileInput.value = '';
    return;
  }
  const list = Array.from(files || []).filter(f => f.type.startsWith('image/'));
  if (!list.length) return;

  for (const file of list) {
    if (pendingImages.length >= GLOBAL.maxImagesPerSend) {
      toast(`最多一次上传 ${GLOBAL.maxImagesPerSend} 张图片`);
      break;
    }
    const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
    pendingImages.push({ id, dataUrl: '', name: file.name, loading: true });
    renderPreview(); updateSendBtn();
    try {
      const { dataUrl } = await compressImage(file);
      const target = pendingImages.find(p => p.id === id);
      if (!target) continue;
      target.dataUrl = dataUrl; target.loading = false;
    } catch (err) {
      pendingImages = pendingImages.filter(p => p.id !== id);
      toast(err.message || '图片处理失败');
    }
    renderPreview(); updateSendBtn();
  }
  fileInput.value = '';
}

/* =========================================================
 * 10. 流式请求（chat 格式）
 * ========================================================= */
async function streamChat(model, payload, onDelta, signal) {
  const res = await fetch(model.apiUrl, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(model.apiKey ? { Authorization: `Bearer ${model.apiKey}` } : {}),
      ...(model.headers || {}),
    },
    body: JSON.stringify(payload),
    signal,
  });

  if (!res.ok) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 300); } catch (e) {}
    throw new Error(`请求失败 ${res.status}${detail ? '：' + detail : ''}`);
  }

  const ct = res.headers.get('content-type') || '';
  if (!res.body || ct.includes('application/json')) {
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || '模型返回错误');
    const c = data?.choices?.[0]?.message?.content ?? '';
    if (typeof c === 'string' && c) onDelta(c);
    return;
  }

  const reader  = res.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';

  const handleLine = (line) => {
    const s = line.trim();
    if (!s || !s.startsWith('data:')) return;
    const data = s.slice(5).trim();
    if (!data || data === '[DONE]') return;
    let json;
    try { json = JSON.parse(data); } catch (e) { return; }
    if (json.error) throw new Error(json.error.message || '模型返回错误');
    const choice = json.choices?.[0];
    const delta  = choice?.delta || choice?.message || {};
    const text = delta.content ?? delta.text ?? '';
    if (typeof text === 'string' && text) onDelta(text);
  };

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf('\n')) >= 0) {
      const line = buffer.slice(0, idx).replace(/\r$/, '');
      buffer = buffer.slice(idx + 1);
      handleLine(line);
    }
  }
  if (buffer.trim()) handleLine(buffer);
}

/* =========================================================
 * 11. 原生图片生成接口（images 格式）
 *     当模型 format='images' 时使用
 * ========================================================= */
async function requestImageGen(model, prompt, signal) {
  // 从 apiUrl 推导出 /images/generations 端点
  const url = model.apiUrl.replace(/\/chat\/completions\/?$/, '/images/generations');
  const body = {
    model: model.model,
    prompt: prompt,
    n: 1,
    size: model.imageSize || '1024x1024',
    response_format: 'url',
  };

  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      ...(model.apiKey ? { Authorization: `Bearer ${model.apiKey}` } : {}),
      ...(model.headers || {}),
    },
    body: JSON.stringify(body),
    signal,
  });

  if (!res.ok) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 300); } catch (e) {}
    throw new Error(`生图失败 ${res.status}${detail ? '：' + detail : ''}`);
  }
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || '图片生成失败');
  return data;
}

/** 把图片生成响应转成 HTML */
function renderImageResponse(data) {
  const items = (data && data.data) || [];
  if (!items.length) return '<span class="err">图片生成失败：接口未返回图片</span>';

  let html = '';
  items.forEach(item => {
    if (item.url) {
      html += `<img src="${escapeHtml(item.url)}" alt="生成图片" loading="lazy">`;
    } else if (item.b64_json) {
      html += `<img src="data:image/png;base64,${item.b64_json}" alt="生成图片">`;
    }
  });

  const revised = items[0]?.revised_prompt;
  if (revised) {
    html += `<div class="gen-hint">优化后提示词：${escapeHtml(revised)}</div>`;
  }
  return html || '<span class="err">图片生成失败</span>';
}

/* =========================================================
 * 12. 组装 chat 消息（多模态 + 视觉降级）
 * ========================================================= */
function toApiMessage(m, model) {
  const hasImgs = m.role === 'user' && m.images && m.images.length;
  if (hasImgs) {
    if (model.vision) {
      return {
        role: 'user',
        content: [
          { type: 'text', text: m.content || '请描述这张图片' },
          ...m.images.map(url => ({ type: 'image_url', image_url: { url } })),
        ],
      };
    }
    const note = `[用户发送了 ${m.images.length} 张图片，当前模型不支持图片理解]`;
    return {
      role: 'user',
      content: m.content ? `${m.content}\n${note}` : note,
    };
  }
  return { role: m.role, content: m.content || '' };
}

/* =========================================================
 * 13. 发送主流程
 * ========================================================= */
async function sendMessage(text, images) {
  if (loading) return;
  const model = getModel();
  const imgs = (images || pendingImages.filter(p => !p.loading).map(p => p.dataUrl));
  text = (text || '').trim();
  if (!text && !imgs.length) return;

  const history = getHistory();
  appendMessage('user', text, { plain: true, images: imgs });
  history.push({ role: 'user', content: text, images: imgs.length ? imgs : undefined });

  inputEl.value = '';
  inputEl.style.height = 'auto';
  pendingImages = [];
  renderPreview();
  updateSendBtn();

  const { bubble } = appendMessage('ai', '', { loading: true });
  loading = true;
  updateSendBtn();
  controller = new AbortController();

  // 超时控制（生图模型通常需要更长时间）
  const timeoutMs = model.timeout || 300000;
  const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

  try {
    /* ---------- A. images 格式：原生图片生成 ---------- */
    if (model.format === 'images') {
      // 输入仅取最新一条文本（images 接口不支持多轮历史）
      const prompt = text || '请生成一张图片';
      const data = await requestImageGen(model, prompt, controller.signal);
      const html = renderImageResponse(data);
      bubble.innerHTML = html;
      history.push({ role: 'assistant', content: html });
      saveState();
      return;
    }

    /* ---------- B. chat 格式：多模态对话（流式） ---------- */
    const ctx = history.slice(-GLOBAL.maxContextMessages).map(m => toApiMessage(m, model));
    const payload = {
      model: model.model,
      stream: true,
      temperature: model.temperature ?? 0.7,
      max_tokens: model.maxTokens ?? 8192,
      messages: [
        ...(model.systemPrompt ? [{ role: 'system', content: model.systemPrompt }] : []),
        ...ctx,
      ],
    };

    let answer = '';
    let stick = true;
    let rafId = null;

    const paint = () => {
      if (rafId) return;
      rafId = requestAnimationFrame(() => {
        rafId = null;
        // 流式过程中不渲染图片，避免出现半截 URL
        bubble.innerHTML = mdToHtml(answer, false);
        if (stick) messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    };

    bubble.classList.add('streaming');
    bubble.innerHTML = '';

    await streamChat(model, payload, (chunk) => {
      stick = isNearBottom();
      answer += chunk;
      paint();
    }, controller.signal);

    if (rafId) cancelAnimationFrame(rafId);
    bubble.innerHTML = answer
      ? mdToHtml(answer, true)
      : '<span class="err">模型没有返回内容</span>';

    history.push({ role: 'assistant', content: answer });
    saveState();

  } catch (err) {
    console.error(err);

    // 判断是否超时
    const isTimeout = err.name === 'AbortError' &&
                      controller && controller.signal.aborted;

    if (err.name === 'AbortError') {
      bubble.classList.remove('streaming');
      // 用户主动停止还是超时？这里统一按"已停止"处理，超时也提示
      const msg = /图片/.test(model.desc) ? '已停止生成' : '已停止生成';
      bubble.innerHTML = `<span class="err">${msg}</span>`;
      // 回滚这条用户消息（避免污染下一次请求）
      if (history[history.length - 1]?.role === 'user') history.pop();
    } else {
      bubble.classList.remove('streaming');
      bubble.innerHTML = `<span class="err">😥 ${escapeHtml(err.message)}</span>`;
      if (history[history.length - 1]?.role === 'user') history.pop();
    }
  } finally {
    clearTimeout(timeoutId);
    bubble.classList.remove('streaming');
    loading = false;
    controller = null;
    updateSendBtn();
    scrollToBottom(false);
  }
}

/* =========================================================
 * 14. UI 状态
 * ========================================================= */
const ICON_SEND = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
  stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>`;
const ICON_STOP = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;

/* =========================================================
 * 15. 模型选择面板
 * ========================================================= */
const ICON_CHECK = `<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;

function renderModelList() {
  modelListEl.innerHTML = '';
  MODELS.forEach(m => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'model-item' + (m.id === currentModelId ? ' active' : '');

/* =========================================================
 * 16. 切换模型 / 历史渲染
 * ========================================================= */
function renderHistory() {
  messagesEl.innerHTML = '';
  const h = getHistory();
  if (!h.length) { showWelcome(); return; }
  const model = getModel();

  h.forEach(m => {
    if (m.role === 'user') appendMessage('user', m.content, { plain: true, images: m.images });
    else appendMessage('ai', m.content, { allowImages: true });
  });

  const hasImgHistory = h.some(m => m.images && m.images.length);
  if (hasImgHistory && !model.vision) {
    const note = document.createElement('div');
    note.className = 'meta-note';
    note.style.cssText = 'text-align:center;padding:4px 0 2px;font-size:12px;color:#9aa1ae';
    note.textContent = '历史中包含图片，当前模型不支持图片理解，将以文字占位发送';
    messagesEl.appendChild(note);
  }
  scrollToBottom(true);
}

function switchModel(id) {
  closeSheet();
  if (id === currentModelId) return;
  if (loading) { controller?.abort(); toast('已停止上一个模型的生成'); }
  currentModelId = id;
  pendingImages = [];
  renderPreview();
  updateModelUI();
  renderHistory();
  updateSendBtn();
  saveState();
  toast(`已切换到「${getModel().name}」`);
}

/* =========================================================
 * 17. 本地存储
 * ========================================================= */
function saveState() {
  try {
    let data = { currentModelId, histories };
    let json = JSON.stringify(data);
    if (json.length > 3.5e6) {
      const slim = {};
      for (const k in histories) {
        slim[k] = histories[k].map(m => {
          if (m.images && m.images.length) {
            return { role: m.role, content: (m.content || '') + '（图片已省略）' };
          }
          return m;
        });
      }
      data = { currentModelId, histories: slim };
      json = JSON.stringify(data);
    }
    localStorage.setItem(GLOBAL.storageKey, json);
  } catch (e) { console.warn('历史保存失败', e); }
}

function loadState() {
  try {
    const raw = localStorage.getItem(GLOBAL.storageKey);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || typeof data !== 'object') return false;
    histories = data.histories && typeof data.histories === 'object' ? data.histories : {};
    if (data.currentModelId && MODELS.some(m => m.id === data.currentModelId)) {
      currentModelId = data.currentModelId;
    }
    for (const k in histories) {
      if (!Array.isArray(histories[k])) { delete histories[k]; continue; }
      histories[k] = histories[k].filter(m =>
        m && (m.role === 'user' || m.role === 'assistant') &&
        (typeof m.content === 'string' || Array.isArray(m.images))
      );
    }
    return true;
  } catch (e) { return false; }
}

/* =========================================================
 * 18. 事件绑定
 * ========================================================= */
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  updateSendBtn();
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (!loading && (inputEl.value.trim() || pendingImages.length)) {
      sendMessage(inputEl.value);
    }
  }
});

inputEl.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  const files = [];
  for (const it of items) {
    if (it.kind === 'file' && it.type.startsWith('image/')) {
      const f = it.getAsFile();
      if (f) files.push(f);
    }
  }
  if (files.length) { e.preventDefault(); addImages(files); }
});

attachBtn.addEventListener('click', () => {
  const m = getModel();
  if (!m.vision) { toast(`「${m.name}」不支持图片输入`); return; }
  fileInput.click();
});
fileInput.addEventListener('change', () => addImages(fileInput.files));

sendBtn.addEventListener('click', () => {
  if (loading) controller?.abort();
  else sendMessage(inputEl.value);
});

clearBtn.addEventListener('click', () => {
  const h = getHistory();
  if (!h.length && !pendingImages.length) return;
  if (confirm(`确定清空「${getModel().name}」的对话吗？`)) {
    if (loading) controller?.abort();
    histories[currentModelId] = [];
    pendingImages = [];
    renderPreview();
    messagesEl.innerHTML = '';
    updateSendBtn();
    showWelcome();
    saveState();
  }
});

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    if (isNearBottom()) scrollToBottom(true);
  });
}

/* =========================================================
 * 19. 启动
 * ========================================================= */
